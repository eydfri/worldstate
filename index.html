cx.setTransform(1,0,0,1,0,0);drawWars();cx.font="bold 11px 'Courier New',monospace";cx.textAlign="center";cx.lineJoin="round";cx.lineWidth=3;
C.forEach((c,i)=>{const o=st[i].o,own=live(o)&&players[o],X=cam.x+(c.cx+.5)*K*cam.z,Y=cam.y+(c.cy+.5)*K*cam.z;if(X<-80||X>cv.width+80||Y<-20||Y>cv.height+20)return;
if(own){cx.fillStyle="#000";cx.fillRect(X-4,Y-4,8,8);cx.fillStyle=players[o].color;cx.fillRect(X-3,Y-3,6,6)}
if(own||i==sel||c.bw*K*cam.z>c.name.length*6.4){cx.strokeStyle="#000c";cx.strokeText(c.name,X,Y+(own?16:4));cx.fillStyle=i==sel?"#ffe08a":"#fff";cx.fillText(c.name,X,Y+(own?16:4))}})}
function drawWars(){cx.strokeStyle="rgba(255,70,70,.9)";cx.lineWidth=2;cx.setLineDash([6,4]);for(const w of wars){const a=C[w.a],d=C[w.d];if(Math.abs(a.cx-d.cx)>W/2)continue;cx.beginPath();cx.moveTo(cam.x+(a.cx+.5)*K*cam.z,cam.y+(a.cy+.5)*K*cam.z);cx.lineTo(cam.x+(d.cx+.5)*K*cam.z,cam.y+(d.cy+.5)*K*cam.z);cx.stroke()}cx.setLineDash([])}
const cellAt=e=>{const r=cv.getBoundingClientRect(),f=cv.width/r.width,x=Math.floor(((e.clientX-r.left)*f-cam.x)/cam.z/K),y=Math.floor(((e.clientY-r.top)*f-cam.y)/cam.z/K);return x>=0&&x<W&&y>=0&&y<H?G[y*W+x]:-1};
let drag=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,m:0}};
cv.onpointermove=e=>{if(!ready)return;const f=cv.width/cv.getBoundingClientRect().width;if(drag){const dx=(e.clientX-drag.x)*f,dy=(e.clientY-drag.y)*f;if(Math.abs(dx)+Math.abs(dy)>6)drag.m=1;if(drag.m){cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCam()}}
const i=cellAt(e),tp=$("tip");if(i>=0&&!(drag&&drag.m)){tp.style.display="block";tp.style.left=e.clientX+14+"px";tp.style.top=e.clientY+14+"px";tp.textContent=C[i].name+(cname(st[i].o)?" — "+cname(st[i].o):"")}else tp.style.display="none"};
cv.onpointerup=e=>{if(ready&&drag&&!drag.m){const i=cellAt(e);if(i>=0){sel=i;ui()}}drag=null};cv.onpointerleave=()=>$("tip").style.display="none";
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),f=cv.width/r.width;zoomAt(e.deltaY<0?1.25:.8,(e.clientX-r.left)*f,(e.clientY-r.top)*f)};
$("zi").onclick=()=>zoomAt(1.5,cv.width/2,cv.height/2);$("zo").onclick=()=>zoomAt(.67,cv.width/2,cv.height/2);$("zr").onclick=()=>{cam.z=1;clampCam()};
/* ===== СЕТЬ (WebSocket или вкладки браузера — один интерфейс) ===== */
function startNet(){let ws,bc;if(CFG.WS_URL){const open=()=>{ws=new WebSocket(CFG.WS_URL+"/?room="+CFG.ROOM);ws.onopen=()=>{netOk=true;send({t:"need"});ui()};ws.onmessage=e=>{try{h(JSON.parse(e.data))}catch(_){}};ws.onclose=()=>{netOk=false;setTimeout(open,2000)}};open()}
else{bc=new BroadcastChannel("worldstate-"+CFG.ROOM);bc.onmessage=e=>h(e.data);netOk=true;setTimeout(()=>send({t:"need"}),200)}
send=m=>{m.from=ID;if(ws){if(ws.readyState==1)ws.send(JSON.stringify(m))}else bc.postMessage(m)}}
function h(m){const f=m.from;if(!ready||!f||f==ID)return;
if(m.t=="need"&&me)send({t:"snap",st,pl:players,al,wars});
else if(m.t=="snap"&&!got&&m.st.length==N){got=true;st=m.st;players=m.pl;al=m.al;wars=m.wars||[];fillSel()}
else if(m.t=="sync"){players[f]={name:m.p.name,color:m.p.color,cid:m.cid,seen:Date.now(),t0:m.p.t0};for(const k in m.c)if(st[k]){Object.assign(st[k],m.c[k]);st[k].o=f}if(m.b)for(const k in m.b){const v=m.b[k],x=st[k];if(x&&isAI(x.o)){x.m=v[0];x.g=v[1];x.a=v[2];x.s=v[3];x.o=v[4]}}fillSel()}
else if(m.t=="war")addWar(m.a,m.d,m.end);
else if(m.t=="hit")applyHit(m.a,m.d,m.r);
else if(m.t=="chat")addLog("<b style='color:"+esc(players[f]?players[f].color:"#fff")+"'>"+esc(players[f]?players[f].name:"?")+":</b> "+esc(m.x));
else if(m.t=="ally"&&me&&m.b==me.cid){if(confirm((players[f]?players[f].name:"Игрок")+" ("+C[m.a].name+") предлагает союз. Принять?")){al[m.a+"-"+m.b]=al[m.b+"-"+m.a]=1;send({t:"allyok",a:m.a,b:m.b});addLog("🤝 Союз: "+C[m.a].name+" и "+C[m.b].name)}}
else if(m.t=="allyok"){al[m.a+"-"+m.b]=al[m.b+"-"+m.a]=1;addLog("🤝 Союз: "+C[m.a].name+" и "+C[m.b].name)}
ui()}
/* ===== ИГРОВАЯ ЛОГИКА ===== */
function fight(A,D){const pa=A.a*(.7+Math.random()*.6),pd=D.a*(.8+Math.random()*.6)+1;return pa>pd?{win:1,da:Math.max(1,Math.round((pa-pd)/3)),ds:12+Math.round(Math.random()*8),loot:Math.round(D.m*.1)}:{win:0,da:0,ds:0,loot:0}}
function applyHit(a,d,r){const A=st[a],D=st[d];D.a=Math.max(0,D.a-r.da);D.s-=r.ds;if(r.win){const l=Math.min(r.loot,D.m);D.m-=l;A.m+=l}else A.a=Math.max(0,A.a-1);fx.push({i:d,t:performance.now()});
addLog("⚔ "+C[a].name+" → "+C[d].name+(r.win?" успех":" отбито"));
if(D.s<=0&&r.win){const no=A.o||"AI:"+a;st.forEach(x=>{if(x.o==="AI:"+d)x.o=no});D.o=no;D.s=35;D.a=Math.max(D.a,2);A.g+=D.g*.25|0;addLog("🏴 "+C[d].name+" захвачена ("+C[a].name+")");if(me&&st[me.cid].o!=ID){me=null;$("ot").textContent="СТРАНА ПОТЕРЯНА";$("od").textContent="Твою столицу захватили. Выбери новую страну.";$("ov").style.display="flex";fillSel()}}}
function tick(n){wars=wars.filter(w=>{if(w.end>n)return true;truce[w.a+"-"+w.d]=truce[w.d+"-"+w.a]=n+20;addLog("🕊 Мир: "+C[w.a].name+" и "+C[w.d].name);return false});
st.forEach((x,i)=>{x.m+=x.g*.35*x.s/100;x.g*=1.003;x.s=Math.min(100,x.s+1);if(isAI(x.o)&&x.a<Math.min(40,Math.round(C[i].a*1.5)+3)&&(Math.imul((n*31+i*17)|0,-1640531535)>>>0)%7==0)x.a++});
for(const k in players)if(k!=ID&&Date.now()-players[k].seen>40000){st.forEach(x=>{if(x.o==k)x.o=null});delete players[k]}
if(me){const c={};st.forEach((x,i)=>{if(x.o==ID)c[i]={m:x.m,g:x.g,a:x.a,s:x.s}});const host=isHost();send({t:"sync",cid:me.cid,c,b:host?botSnap():undefined,p:{name:me.name,color:me.color,t0:me.t0}});players[ID].seen=Date.now();if(host)aiTurn(n)}}
const isAI=o=>!o||o.startsWith("AI:"),isHost=()=>me&&Object.keys(players).filter(live).sort()[0]===ID;
const botSnap=()=>{const b={};st.forEach((x,i)=>{if(isAI(x.o))b[i]=[Math.round(x.m),+x.g.toFixed(2),x.a,Math.round(x.s),x.o]});return b};
const atWar=(a,d)=>wars.some(w=>(w.a==a&&w.d==d)||(w.a==d&&w.d==a));
function addWar(a,d,end){if(atWar(a,d))return;wars.push({a,d,end});addLog("🔥 "+C[a].name+" объявила войну: "+C[d].name+(st[d].o==ID?" (ВАШИ ЗЕМЛИ!)":""))}
function declareWar(a,d,n){const end=n+6+Math.floor(Math.random()*7);addWar(a,d,end);send({t:"war",a,d,end});
if(isHost())for(const j of C[d].adj)if(al[d+"-"+j]&&isAI(st[j].o)&&adjM[j*N+a]&&!atWar(j,a)&&Math.random()<.5){addWar(j,a,end);send({t:"war",a:j,d:a,end})}}
function aiTurn(n){const ind=[];st.forEach((x,i)=>{if(!x.o)ind.push(i)});if(ind.length<2)return;
for(const i of ind){const x=st[i],ac=60+x.a*8,ic=Math.max(120,x.g*2);if(x.m>ac*2&&x.a<Math.min(40,Math.round(C[i].a*1.5)+3)){x.m-=ac;x.a++}else if(x.m>ic*4){x.m-=ic;x.g*=1.06}}
for(let t=0;t<2;t++){const a=ind[Math.random()*ind.length|0],nb=C[a].adj.filter(j=>!st[j].o&&!al[a+"-"+j]&&!atWar(a,j));if(nb.length&&Math.random()<.08){const b=nb[Math.random()*nb.length|0];al[a+"-"+b]=al[b+"-"+a]=1;send({t:"allyok",a,b});addLog("🤝 Союз: "+C[a].name+" и "+C[b].name)}}
if(wars.length<Math.max(2,Math.round(N/25)))for(let t=0;t<3;t++){const a=ind[Math.random()*ind.length|0],A=st[a];if(A.a<5||wars.filter(w=>w.a==a||w.d==a).length>1||st.filter(x=>x.o==="AI:"+a).length>=3)continue;
const tg=C[a].adj.filter(j=>{if(al[a+"-"+j]||atWar(a,j)||(truce[a+"-"+j]||0)>n)return false;const o=st[j].o;if(o&&!o.startsWith("AI:")){const p=players[o];if(!live(o)||!p||Date.now()-p.t0<180000)return false}return true}).sort((x,y)=>st[x].a-st[y].a);
if(!tg.length)continue;const j=Math.random()<.6?tg[0]:tg[Math.random()*tg.length|0];
if(A.a/(st[j].a+1)>=1&&Math.random()<.5){declareWar(a,j,n);break}}
for(const w of[...wars])for(const[x,y,p]of[[w.a,w.d,.5],[w.d,w.a,.3]]){if(st[x].o||st[x].a<1||Math.random()>p||!adjM[x*N+y]||al[x+"-"+y])continue;const r=fight(st[x],st[y]);r.ds=Math.round(r.ds*.7);send({t:"hit",a:x,d:y,r});applyHit(x,y,r)}}
const costs=()=>{const a=st[me.cid];return{inv:Math.round(Math.max(120,a.g*2)),soc:Math.round(a.g*.8+40),arm:60+a.a*8,atk:Math.round(40+a.a*3)}};
function act(k){if(!me)return;const a=st[me.cid],c=costs();if(a.m<c[k])return toast("Недостаточно средств");a.m-=c[k];
if(k=="inv"){a.g+=a.g*.06;addLog("🏗 Инфраструктура: ВВП растёт")}if(k=="soc"){a.s=Math.min(100,a.s+8);addLog("🏥 Социальная программа")}if(k=="arm"){a.a++;addLog("🪖 Армия усилена")}ui()}
function attack(){if(!me)return;const A=st[me.cid];if(!canAtk(sel))return toast("Нет общей границы или морского доступа");if(Date.now()<cool)return toast("Войска перегруппируются…");const c=costs();if(A.m<c.atk)return toast("Недостаточно средств");A.m-=c.atk;cool=Date.now()+3000;const r=fight(A,st[sel]);send({t:"hit",a:me.cid,d:sel,r});applyHit(me.cid,sel,r);if(!st[sel].o&&!atWar(sel,me.cid)){const k=ownedBy().find(k=>adjM[k*N+sel]);if(k!=null&&Math.random()<.8)declareWar(sel,k,lastTick)}ui()}
function ally(){if(!me)return;const D=st[sel];if(D.o==ID)return;if(live(D.o)){send({t:"ally",a:me.cid,b:sel});return toast("Предложение отправлено")}if(D.o||atWar(me.cid,sel))return toast("Сейчас нельзя");if(Math.random()<.6){al[me.cid+"-"+sel]=al[sel+"-"+me.cid]=1;send({t:"allyok",a:me.cid,b:sel});addLog("🤝 Союз: "+C[me.cid].name+" и "+C[sel].name)}else toast(C[sel].name+" отклонила союз")}
/* ===== ИНТЕРФЕЙС ===== */
const cname=o=>o&&o.startsWith("AI:")?C[+o.slice(3)].name+" (ИИ)":o==ID?(me?me.name:"Вы"):(players[o]?players[o].name:null);
function fillSel(){const s=$("cs"),v=s.value;s.innerHTML=[...C.keys()].filter(i=>!live(st[i].o)).sort((a,b)=>C[a].name.localeCompare(C[b].name,"ru")).map(i=>"<option value='"+i+"'>"+esc(C[i].name)+" — ВВП "+C[i].g+", армия "+C[i].a+"</option>").join("");if(v)s.value=v}
function ui(){dirty=true;$("net").textContent=(CFG.WS_URL?(netOk?"ОНЛАЙН":"ПОДКЛЮЧЕНИЕ…"):"ЛОКАЛЬНО")+" · игроков: "+Math.max(1,Object.keys(players).length);if(!ready)return;
if(me){const a=st[me.cid],c=costs();$("tm").textContent=fmt(a.m);$("hn").textContent=C[me.cid].name.toUpperCase();
$("my").innerHTML=[["Казна",fmt(a.m)],["ВВП",fmt(a.g)],["Армия",a.a],["Стран",ownedBy().length]].map(v=>"<div class=s><small>"+v[0]+"</small><b>"+v[1]+"</b></div>").join("");
$("sb").style.width=Math.max(0,a.s)+"%";$("mb").innerHTML="<button class=gr onclick=act('inv')>Инфра "+c.inv+"</button><button onclick=act('soc')>Соцпрогр. "+c.soc+"</button><button class=y onclick=act('arm')>Армия "+c.arm+"</button>"}
const D=st[sel],on=cname(D.o),mine=D.o==ID;
$("tg").innerHTML="<div class=row><b>"+esc(C[sel].name)+(wars.some(w=>w.a==sel||w.d==sel)?" ⚔":"")+"</b><span>"+(on?esc(on):"ИИ-государство")+"</span></div><div class=row><span>ВВП / Армия</span><span>"+fmt(D.g)+" / "+D.a+"</span></div><div class=row><span>Стабильность</span><span>"+Math.max(0,Math.round(D.s))+"%</span></div>"+(me&&!mine?"<div class=bt style='margin-top:8px'><button class=r "+(canAtk(sel)?"":"disabled")+" onclick=attack()>⚔ Атаковать "+costs().atk+"</button><button class=gr onclick=ally()>🤝 Союз</button></div>"+(canAtk(sel)?"":"<div class=foot style='padding:6px 0'>Нет границы с вашими землями.</div>"):"");
const sc={};st.forEach(x=>{if(x.o){const q=sc[x.o]||(sc[x.o]={n:0,g:0});q.n++;q.g+=x.g}});for(const k in sc)if(k.startsWith("AI:")){sc[k].n++;sc[k].g+=st[+k.slice(3)].g}
$("rk").innerHTML=Object.entries(sc).sort((a,b)=>b[1].n-a[1].n||b[1].g-a[1].g).slice(0,8).map(([k,v])=>"<div class=row><span><i class=dot style='background:"+esc(players[k]?players[k].color:"#888")+"'></i>"+esc(cname(k)||"?")+"</span><span>"+v.n+" стр · ВВП "+fmt(v.g)+"</span></div>").join("")||"Пока никого"}
$("ci").onkeydown=e=>{if(e.key=="Enter"&&e.target.value.trim()&&me){const x=e.target.value.trim();send({t:"chat",x});addLog("<b style='color:"+me.color+"'>"+esc(me.name)+":</b> "+esc(x));e.target.value=""}};
$("fs").onchange=e=>{const i=C.findIndex(c=>c.name.toLowerCase()==e.target.value.trim().toLowerCase());if(i>=0){sel=i;centerOn(i);ui();e.target.value=""}};
$("go").onclick=()=>{const cid=+$("cs").value,name=$("nm").value.trim()||"Президент";if(isNaN(cid)||live(st[cid].o))return toast("Страна занята");
me={cid,name,color:PAL[parseInt(ID,36)%PAL.length],t0:Date.now()};st[cid].o=ID;players[ID]={name,color:me.color,cid,seen:Date.now(),t0:me.t0};sel=cid;$("ov").style.display="none";centerOn(cid);addLog("Президент "+esc(name)+" вступил в должность!");tick(lastTick);ui()};
/* ===== ЗАПУСК ===== */
async function boot(){let data;for(const u of CFG.GEO){try{const r=await fetch(u);if(r.ok){data=await r.json();break}}catch(_){}}
if(!data){$("od").textContent="Не удалось загрузить карту мира. Проверь интернет и обнови страницу.";return}
build(data);$("dl").innerHTML=C.map(c=>"<option value='"+esc(c.name)+"'>").join("");ready=true;startNet();fillSel();$("od").textContent="Выбери имя и страну — доступны все "+N+" государств мира. Захватывай соседей, расти экономику, заключай союзы.";$("go").disabled=false;clampCam();ui();
(function loop(t){const n=Math.floor(Date.now()/TICK);while(lastTick<n){lastTick++;tick(lastTick);ui()}$("tk").textContent=Math.ceil((TICK-Date.now()%TICK)/1000);if(dirty&&t-lastR>120){renderBase();dirty=false;lastR=t}draw(t);setTimeout(()=>requestAnimationFrame(loop),50)})(0)}
boot();
</script></body></html>
